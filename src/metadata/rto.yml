# PURL configuration for http://purl.obolibrary.org/obo/rto

idspace: RTO
base_url: /obo/rto

products:
- rto.owl: https://raw.githubusercontent.com/aapm-bdsc-ontology-tg/rto/main/rto.owl
- rto.obo: https://raw.githubusercontent.com/aapm-bdsc-ontology-tg/rto/main/rto.obo

term_browser: ontobee
example_terms:
- RTO_0000000

entries:

- prefix: /releases/
  replacement: https://raw.githubusercontent.com/aapm-bdsc-ontology-tg/rto/v

- prefix: /tracker/
  replacement: https://github.com/aapm-bdsc-ontology-tg/rto/issues

- prefix: /about/
  replacement: http://www.ontobee.org/ontology/RTO?iri=http://purl.obolibrary.org/obo/

## generic fall-through, serve direct from github by default
- prefix: /
  replacement: https://raw.githubusercontent.com/aapm-bdsc-ontology-tg/rto/main/

