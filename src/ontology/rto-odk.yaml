      module_type: filter
      base_iris:
        - http://purl.obolibrary.org/obo/BFO_
        - http://purl.obolibrary.org/obo/IAO_
    - id: bfo
      module_type: slme
      module_type_slme: top
      base_iris:
        - http://purl.obolibrary.org/obo/BFO_
        - http://purl.obolibrary.org/obo/RO_
        - http://purl.obolibrary.org/obo/IAO_
    - id: ogms
