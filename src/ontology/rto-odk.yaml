      module_type: filter
    - id: pato
      module_type: filter
      base_iris:
        - http://purl.obolibrary.org/obo/PATO_
        - http://purl.obolibrary.org/obo/CHEBI_
    - id: cob
      module_type: filter
      base_iris:
        - http://purl.obolibrary.org/obo/CHEBI_
